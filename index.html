    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Qué tipo de eventos privados se pueden celebrar en la sala?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "En Leona Park puedes organizar eventos privados como cumpleaños, baby showers, reuniones familiares, despedidas, jubilaciones o encuentros corporativos. El espacio está diseñado para adaptarse a diferentes formatos y públicos, con un ambiente cálido y versátil que se personaliza según tus preferencias."
            }
          },
          {
            "@type": "Question",
            "name": "¿Puedo alquilar el espacio de forma flexible por horas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, ofrecemos un modelo de alquiler de espacios para eventos con total flexibilidad horaria. Podrás reservar por tramos adaptados a tu celebración, ya sea para unas pocas horas o para eventos de mayor duración. Esta opción permite aprovechar el espacio según tus necesidades, sin pagar más de lo necesario."
            }
          },
          {
            "@type": "Question",
            "name": "¿Se pueden celebrar cumpleaños para todas las edades?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Claro, nuestra sala de fiestas está pensada para celebraciones de todas las edades. Contamos con zonas para peques, sonido de calidad y un entorno adaptable también para adultos. Decoramos según el estilo y temática deseada, para crear experiencias memorables sin importar la edad del homenajeado."
            }
          },
          {
            "@type": "Question",
            "name": "¿Dónde se encuentra ubicada la sala de fiestas Leona Park?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nos encontrarás en una zona accesible y bien comunicada de Alhaurín de la Torre (Málaga), en calle Salvador de Madariaga, edificio Edipsa Dalias, local 10. Contamos con cercanía a tiendas y supermercados, lo que facilita cualquier necesidad de último minuto durante tu evento. El entorno es cómodo y seguro para todos."
            }
          }
        ]
      }
    </script>
